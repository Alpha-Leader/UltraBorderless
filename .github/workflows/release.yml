name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release --locked

      # Deliberately not UPX-packed: the release profile already applies
      # opt-level = "z", LTO and strip, and a packed unsigned binary that
      # restyles other processes' windows is a strong antivirus heuristic
      # trigger for very little size saving.

      - name: Generate SHA256SUMS.txt
        run: |
          $exe = "target/release/ultraborderless.exe"
          $hash = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          "$hash  ultraborderless.exe" | Out-File -Encoding ascii SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            target/release/ultraborderless.exe
            SHA256SUMS.txt
          draft: true
