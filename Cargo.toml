[package]
name = "ultraborderless"
version = "1.2.1"
edition = "2024"
description = "Windows utility for making any window borderless and placing it into a region of a monitor, sized and anchored how you want."
authors = ["Alpha-Leader"]
license = "GPL-3.0-only"
repository = "https://github.com/Alpha-Leader/UltraBorderless"
readme = "README.md"

[dependencies]
eframe = { version = "0.32.1", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = { version = "0.32.1", default-features = false, features = [
    "default_fonts",
] }
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
] }
anyhow = { version = "1.0", default-features = false }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }

[build-dependencies]
embed-resource = { version = "3.0", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 1
